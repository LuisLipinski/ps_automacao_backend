name: My Pet Admin Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  automation-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject tracked environment secret files
        shell: bash
        run: |
          tracked_env=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$tracked_env" ]; then
            echo "Arquivos de ambiente versionados indevidamente:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Reject empty test placeholders
        shell: bash
        run: |
          empty_specs=$(find tests -type f -name '*.spec.ts' -size 0 -print)
          if [ -n "$empty_specs" ]; then
            echo "Specs vazias encontradas:"
            echo "$empty_specs"
            exit 1
          fi

      - name: Validate Playwright test discovery
        run: npx playwright test --list

  live-api-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: automation-quality
    runs-on: ubuntu-latest
    env:
      PS_EMPRESA_URL: https://ps-empresa.onrender.com
      PS_CONTRATO_URL: https://ps-contrato.onrender.com
      PS_EMPRESA_INTERNAL_KEY: ${{ secrets.INTERNAL_API_KEY }}
      PS_CONTRATO_INTERNAL_KEY: ${{ secrets.INTERNAL_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate internal API key
        shell: bash
        run: |
          test -n "$PS_EMPRESA_INTERNAL_KEY" || { echo "Secret INTERNAL_API_KEY ausente"; exit 1; }

      - name: Wake Render services
        shell: bash
        run: |
          wake_service() {
            local name="$1"
            local base_url="$2"
            local max_attempts=24

            for attempt in $(seq 1 "$max_attempts"); do
              if curl -fsS --connect-timeout 5 --max-time 15 "$base_url/actuator/health" > "/tmp/${name}-health.json"; then
                echo "$name disponível"
                cat "/tmp/${name}-health.json"
                return 0
              fi

              echo "$name ainda indisponível (tentativa $attempt/$max_attempts)"
              sleep 5
            done

            echo "$name não ficou disponível dentro da janela de aquecimento"
            return 1
          }

          wake_service "ps-empresa" "$PS_EMPRESA_URL" &
          empresa_pid=$!
          wake_service "ps-contrato" "$PS_CONTRATO_URL" &
          contrato_pid=$!

          empresa_rc=0
          contrato_rc=0
          wait "$empresa_pid" || empresa_rc=$?
          wait "$contrato_pid" || contrato_rc=$?

          if [ "$empresa_rc" -ne 0 ] || [ "$contrato_rc" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run backend smoke and security suites
        run: |
          npm run backend:smoke
          npm run backend:security

      - name: Run destructive Empresa-Contrato lifecycle
        env:
          RUN_DESTRUCTIVE_INTEGRATION: 'true'
        run: npx playwright test tests/api/ps_contrato/integration/empresa-contrato-lifecycle.spec.ts --project=ps_contrato

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-report
          path: playwright-report
          if-no-files-found: ignore
